name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: fixproof

jobs:
  unit:
    name: unit (verdict, policy, API input handling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest tests/test_verdict.py tests/test_policy.py tests/test_api.py -q

  replay:
    name: replay real CVEs in the sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Start Postgres
        run: docker compose up -d --wait
      - name: Replay PoCs against real product versions
        run: uv run pytest tests/test_smoke.py tests/test_patch_on_top.py -q
